name: Build and upload JAR to S3

on:
  workflow_dispatch: 
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f ./APP/pom.xml clean package

      - name: Find built jar
        id: find_jar
        run: |
          echo "Searching for jar file in ./APP/target..."
          JAR=$(ls ./APP/target/*.jar 2>/dev/null | grep -v '\\.original' | head -n1 || true)
          if [ -z "$JAR" ]; then
            echo "No jar found in ./APP/target" >&2
            exit 1
          fi
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure awscli present (install if needed)
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws cli not found — installing awscli via pip"
            python3 -m pip install --upgrade awscli
          fi

      - name: Upload JAR to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          JAR=${{ steps.find_jar.outputs.jar }}
          BASENAME=$(basename "$JAR")
          DEST_KEY="${{ github.repository }}/builds/${{ github.sha }}-$BASENAME"
          echo "Uploading $JAR to s3://$S3_BUCKET/$DEST_KEY"
          aws s3 cp "$JAR" "s3://$S3_BUCKET/$DEST_KEY" --acl private
          echo "Uploaded s3://$S3_BUCKET/$DEST_KEY"
